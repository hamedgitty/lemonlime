name: Sandbox image

# Builds docker/sandbox.Dockerfile and publishes it to the GitHub Container Registry as
# ghcr.io/<owner>/lemonlime-sandbox, tagged `latest` and with the commit. Cloud sandbox
# providers (Docker, Daytona, E2B) can start from it instead of building it themselves.

on:
  push:
    branches: [main]
    paths:
      - docker/sandbox.Dockerfile
      - docker/sandbox.Dockerfile.dockerignore
      - packages/protocol/**
      - packages/runner/**
      - pnpm-lock.yaml
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lemonlime-sandbox" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/sandbox.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=LemonLime cloud sandbox: the runner and the agent CLIs
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
