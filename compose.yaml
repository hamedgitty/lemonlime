# Self-hosted LemonLime on one machine: the dashboard (Node + SQLite), a reverse proxy
# with automatic HTTPS, the idle sweep, and cloud threads as Docker containers.
# See docs/self-hosting.md ("C. Docker Compose"), or run scripts/install-ubuntu.sh.
#
#   docker compose --profile build build     # dashboard + sandbox images
#   docker compose up -d
name: lemonlime

services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: lemonlime/web:local
    env_file: .env
    environment:
      LEMONLIME_DATABASE_URL: file:/data/lemonlime.db
      LEMONLIME_HISTORY_DIR: /data/history
      LEMONLIME_SANDBOX_PROVIDER: docker
      LEMONLIME_SANDBOX_IMAGE: ${LEMONLIME_SANDBOX_IMAGE:-lemonlime/sandbox:latest}
      LEMONLIME_DOCKER_NETWORK: lemonlime-sandboxes
      LEMONLIME_DOCKER_PUBLIC_URL: ${LEMONLIME_PUBLIC_URL}/sandbox
      # Runners reach the dashboard through the proxy's sandbox-only port, never directly.
      LEMONLIME_RUNNER_CONTROL_PLANE_URL: http://proxy:8080
      # Every request comes through the one proxy below, which says who the caller is.
      LEMONLIME_TRUSTED_PROXIES: "1"
    volumes:
      - lemonlime-data:/data
      # Lets the dashboard start sandbox containers. Anything with this socket controls
      # Docker on the host, so only run this on a machine dedicated to LemonLime.
      - /var/run/docker.sock:/var/run/docker.sock
    # Not on the sandbox network: sandboxes can only reach it through the proxy.
    networks: [default]
    restart: unless-stopped

  proxy:
    image: caddy:2.8
    ports: ["${LEMONLIME_HTTP_PORT:-80}:80", "${LEMONLIME_HTTPS_PORT:-443}:443"]
    environment:
      LEMONLIME_SITE_ADDRESS: ${LEMONLIME_SITE_ADDRESS:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      default: {}
      sandboxes: { ipv4_address: 172.30.0.2 }
    depends_on: [web]
    restart: unless-stopped

  # Pauses idle sandboxes and records finished runs, once a minute.
  sweep:
    image: curlimages/curl:8.10.1
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do curl -fsS -X POST -H "Authorization: Bearer $$LEMONLIME_CRON_SECRET" http://web:3000/api/cron/sweep > /dev/null || true; sleep 60; done'
    depends_on: [web]
    restart: unless-stopped

  # Not a service: `docker compose --profile build build` builds the image cloud threads run in.
  sandbox-image:
    build: { context: ., dockerfile: docker/sandbox.Dockerfile }
    image: ${LEMONLIME_SANDBOX_IMAGE:-lemonlime/sandbox:latest}
    profiles: ["build"]

networks:
  sandboxes:
    name: lemonlime-sandboxes
    # A fixed bridge name and subnet so scripts/sandbox-firewall.sh can keep sandboxes
    # from reaching each other, this host, the local network and cloud metadata.
    driver_opts:
      com.docker.network.bridge.name: lemonlime-sb
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  lemonlime-data:
  caddy-data:
