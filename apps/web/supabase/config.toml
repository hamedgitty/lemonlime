# Local Supabase settings for the LemonLime control plane.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
# Anything not set here uses the Supabase CLI defaults.
project_id = "lemonlime"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

# Local email inbox for magic links: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# GitHub sign-in (optional). Create an OAuth app on GitHub with the callback
# http://127.0.0.1:54321/auth/v1/callback, put its values in your shell or a
# supabase/.env file, and set NEXT_PUBLIC_SUPABASE_GITHUB=1 for the web app.
[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""
