# gitleaks settings for CI and the pre-commit hook. Keep allowlists narrow: match the
# exact made-up value or placeholder, never whole folders.
[extend]
useDefault = true

[allowlist]
description = "Made-up values in tests and placeholders in docs"
regexTarget = "line"
regexes = [
  # Test-only thread secrets, e.g. "thread-secret-for-tests-0123456789".
  '''[a-z-]+-secret-for-tests-0123456789''',
  '''secret-for-heartbeat-tests-0123''',
  '''wrong-secret-0123456789''',
  # Made-up value in the redaction tests.
  '''npm_abc123secret''',
  # Docs examples that read the secret from an environment variable.
  '''Authorization: Bearer \$[A-Z_]+''',
  '''Authorization: Bearer YOUR_[A-Z_]+''',
]
