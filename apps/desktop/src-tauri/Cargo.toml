[package]
name = "lemonlime-desktop"
version = "0.1.0"
description = "LemonLime desktop app: run coding agents on your computer or in cloud sandboxes."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lemonlime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# The OS keychain (macOS Keychain, Windows Credential Manager, Linux secret service).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
